<script>
const KEY='mealplan_v1';
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const GROUPS={pro:'بروتين',dairy:'ألبان',carb:'نشويات وبقوليات',fruit:'فواكه',fat:'دهون',veg:'خضار'};
const REL={pro:['pro','dairy'],dairy:['dairy','pro'],carb:['carb','fruit'],fruit:['fruit','carb'],fat:['fat'],veg:['veg']};
const KEYM={pro:'p',dairy:'p',carb:'c',fruit:'c',fat:'f',veg:'k'};
const KEYL={p:'بروتين',c:'كارب',f:'دهون',k:'سعرات'};
const PROT={chicken:'chk_b',beef:'beef_l',fish:'fish_w'};
const PL={chicken:'دجاج',beef:'لحم',fish:'سمك'};
// القيم لكل 100 جم: id, الاسم, المجموعة, سعرات, بروتين, كارب, دهون, [وحدة, وزن الوحدة]
const FOODS0=[

['chk_t','فخذ دجاج بدون جلد مشوي','pro',179,25,0,8.2],

['chick','حمص مطبوخ','carb',164,8.9,27,2.6],
['mango','مانجو','fruit',60,0.8,15,0.4],
['banana','موز','fruit',89,1.1,23,0.3],
['apple','تفاح','fruit',52,0.3,14,0.2],
['orange','برتقال','fruit',47,0.9,12,0.1],
['straw','فراولة','fruit',32,0.7,7.7,0.3],
['grape','عنب','fruit',69,0.7,18,0.2],
['dates','تمر','fruit',282,2.5,75,0.4],
['oil','زيت زيتون','fat',884,0,0,100],
['peanut','سوداني غير مملح','fat',567,26,16,49],
['almond','لوز','fat',579,21,22,50],
['walnut','عين جمل','fat',654,15,14,65],
['tahini','طحينة','fat',595,17,21,54],
['avo','أفوكادو','fat',160,2,9,15],
['pbut','زبدة فول سوداني','fat',588,25,20,50],
['salad','سلطة خضار','veg',20,1,4,0.2],
['cuc','خيار','veg',15,0.7,3.6,0.1],
['saute','خضار سوتيه/مشوية','veg',40,2,7,1]
];
// قوالب الوجبات: [الصنف, الجرامات, الدور (P بروتين / C كارب / F دهون / x ثابت), slot]
const TPL={
high:[
 {n:'الوجبة 1 — فطور',it:[['ful',100,'C'],['egg',150,'x'],['bread',60,'C'],['oil',5,'F'],['salad',100,'x']]},
 {n:'الوجبة 2 — غداء',it:[['rice',70,'C'],['@prot',220,'P','prot'],['oil',5,'F'],['salad',100,'x']]},
 {n:'الوجبة 3 — سناك',it:[['mango',100,'C'],['peanut',10,'F'],['yog0',180,'x']]},
 {n:'الوجبة 4 — عشاء',it:[['bread',60,'C'],['chz_l',80,'P'],['pot',100,'C']]}],
low:[
 {n:'الوجبة 1 — فطور',it:[['egg',150,'x'],['cott',100,'P'],['bread',30,'C'],['oil',5,'F'],['salad',150,'x']]},
 {n:'الوجبة 2 — غداء',it:[['rice',30,'C'],['@prot',250,'P','prot'],['oil',10,'F'],['saute',200,'x']]},
 {n:'الوجبة 3 — سناك',it:[['yogg',150,'P'],['peanut',15,'F'],['straw',100,'C']]},
 {n:'الوجبة 4 — عشاء',it:[['tuna',100,'P'],['pot',80,'C'],['saute',150,'x'],['oil',5,'F']]}]
};
let state=null, meta=null, ui={tab:'day',day:(new Date().getDay()+1)%7}, modal=null;
const $=s=>document.querySelector(s);
const rd=Math.round;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=id=>state.foods.find(x=>x.id===id);

const FOOD=it=>it.fd||F(it.f); // سجلات التاريخ تحمل نسخة من قيم الصنف وقت الحفظ (fd)
function mac(it){const f=FOOD(it);if(!f)return{k:0,p:0,c:0,f:0};const q=it.g/100;return{k:f.k*q,p:f.p*q,c:f.c*q,f:f.f*q}}
function sum(items){const t={k:0,p:0,c:0,f:0};items.forEach(i=>{const m=mac(i);t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f});return t}

// ---------- تسجيل الفعلي: it.e = المأكول (جم) · it.em = وجبة الأكل الفعلية · it.x = صنف خارج الخطة ----------
const gE=it=>typeof it.e==='number'?it.e:null;
const emOf=(it,mi)=>typeof it.em==='number'?it.em:mi;
function macE(it){const f=FOOD(it),g=gE(it);if(!f||g==null)return{k:0,p:0,c:0,f:0};const q=g/100;return{k:f.k*q,p:f.p*q,c:f.c*q,f:f.f*q}}
const T0=()=>({k:0,p:0,c:0,f:0}),addT=(t,m)=>{t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f;return t};
const fmtQ=(f,g)=>f&&f.u&&f.ug?(+(g/f.ug).toFixed(1))+' '+f.u:rd(g)+' جم';
const mealShort=(d,i)=>(d.meals[i]?d.meals[i].n:'').split('—')[0].trim();
// ---------- التواريخ (الأسبوع يبدأ السبت) ----------
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const addDays=(dt,n)=>new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+n);
const iso=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const parseISO=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
function weekStart(){const n=new Date();return addDays(n,-((n.getDay()+1)%7))}
const weekKey=()=>iso(weekStart());
const dateOfDay=di=>iso(addDays(weekStart(),di));
const todayISO=()=>iso(new Date());
function dateLabel(s){const d=parseISO(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
// لقطة اليوم كسجل مستقل (وثيقة واحدة لكل مستخدم/تاريخ — جاهزة للنقل لقاعدة بيانات لاحقاً)
function snapDay(d,date,di){
  return{date,dow:di,name:d.name,mode:d.mode,prot:d.prot,tg:targets(d),
    meals:d.meals.map(m=>({n:m.n,items:m.items.map(it=>{const f=F(it.f);if(!f)return null;
      const o={f:it.f,fd:{n:f.n,u:f.u,ug:f.ug,k:f.k,p:f.p,c:f.c,f:f.f,grp:f.grp},g:it.g};
      if(it.e!=null)o.e=it.e;if(typeof it.em==='number')o.em=it.em;if(it.x)o.x=true;return o}).filter(Boolean)})),ts:Date.now()};
}
function clearLog(d){d.meals.forEach(m=>{m.items=m.items.filter(it=>!it.x);m.items.forEach(it=>{delete it.e;delete it.em})});d.lw=null}
function rollWeek(){ // عند أسبوع جديد: يُؤرشف تسجيل الأسبوع السابق في السجل ثم يُمسح من بطاقات الأيام
  const k=weekKey();let ch=false;
  state.days.forEach((d,di)=>{
    if(d.lw&&iso(parseISO(d.lw))!==k){
      if(d.meals.some(m=>m.items.some(it=>gE(it)!=null)))hPut(meta.cur,snapDay(d,iso(addDays(parseISO(d.lw),di)),di));
      clearLog(d);ch=true;
    }
  });
  return ch;
}
function stTag(it,mi){
  if(it.x)return '<span class="tag x">خارج الخطة</span>';
  const e=gE(it);if(e==null)return '';
  if(e===0)return '<span class="tag sk">✗ لم يُؤكل</span>';
  const d=state.days[ui.day],em=emOf(it,mi),f=F(it.f),chg=Math.abs(e-it.g)>0.5,parts=[chg?'≠ '+fmtQ(f,e):'✓ أُكل'];
  if(em!==mi)parts.push('↪ '+mealShort(d,em));
  return `<span class="tag ${chg||em!==mi?'':'ok2'}">${parts.join(' · ')}</span>`;
}
function movedIn(d,mi){
  const r=[];d.meals.forEach((mm,mj)=>{if(mj===mi)return;mm.items.forEach(it=>{if(typeof it.em==='number'&&it.em===mi&&gE(it)>0){const f=F(it.f);if(f)r.push(`<div class="mv">↩ ${esc(f.n)} ${fmtQ(f,gE(it))} — من ${esc(mealShort(d,mj))}</div>`)}})});
  return r.join('');
}
function dayLog(d){
  const plan=T0(),eaten=T0(),pend=T0(),pm=d.meals.map(()=>({plan:T0(),act:T0()})),dev=[];let logged=0,total=0;
  d.meals.forEach((m,mi)=>m.items.forEach(it=>{
    const f=FOOD(it);if(!f)return;
    const mp=mac(it),e=gE(it),em=Math.min(emOf(it,mi),d.meals.length-1);
    addT(plan,mp);addT(pm[mi].plan,mp);
    if(!it.x)total++;
    if(e!=null){
      if(!it.x)logged++;
      const me=macE(it),dk=me.k-mp.k;addT(eaten,me);addT(pm[em].act,me);
      if(it.x)dev.push({t:'extra',txt:`${f.n} — ${fmtQ(f,e)} (خارج الخطة، ${mealShort(d,em)})`,dk});
      else if(e===0)dev.push({t:'skip',txt:`${f.n} — لم يُؤكل (الخطة ${fmtQ(f,it.g)})`,dk});
      else{
        if(Math.abs(e-it.g)>0.5)dev.push({t:'qty',txt:`${f.n} — الخطة ${fmtQ(f,it.g)} ← الفعلي ${fmtQ(f,e)}`,dk});
        if(em!==mi)dev.push({t:'move',txt:`${f.n} — نُقل من ${mealShort(d,mi)} إلى ${mealShort(d,em)}`,dk:0});
      }
    }else if(!it.x)addT(pend,mp);
  }));
  const exp=addT(addT(T0(),eaten),pend);
  return{plan,eaten,pend,exp,logged,total,pm,dev};
}
// ---------- معادلات الأهداف ----------
const clone=o=>JSON.parse(JSON.stringify(o));
const L5=(w,h,a,l,c)=>({w,h,a,l,c});
const DEF_EQS=[

const GDEF={

function fixSettings(s){
  const D={goal:'manual',sex:'m',age:30,ht:175,bf:0,eq:'mifflin',act:1.55,tdeeM:0};
  Object.keys(D).forEach(k=>{if(s[k]==null)s[k]=D[k]});
  if(!Array.isArray(s.eqs)||!s.eqs.length)s.eqs=clone(DEF_EQS);
  if(!s.eqs.some(e=>e.id===s.eq))s.eq=s.eqs[0].id;
  if(!Array.isArray(s.goals)||!s.goals.length)s.goals=clone(DEF_GOALS);
  if(!s.goals.some(g=>g.id===s.goal))s.goal=s.goals[0].id;
  s.g=s.g||{};
  s.goals.forEach(gl=>{if(gl.kind==='manual')return;const b=GDEF[gl.id]||(gl.sign<0?GDEF.cut:gl.sign>0?GDEF.bulk:GDEF.maint);s.g[gl.id]=Object.assign({},b,s.g[gl.id]||{})});
  s.cyc=Object.assign({on:true,r:0.5},s.cyc||{});
  return s;
}
const S=()=>fixSettings(state.settings);
const goalOf=s=>s.goals.find(g=>g.id===s.goal)||s.goals[0];
const eqOf=s=>s.eqs.find(e=>e.id===s.eq)||s.eqs[0];
const SCH=[null,[17.686,658.2,13.384,692.6],[15.057,692.2,14.818,486.6],[11.472,873.1,8.126,845.6],[11.711,587.7,9.082,658.5]];
function bodyOf(s){const w=+s.bw||70,bf=+s.bf>0&&+s.bf<60?+s.bf:0;return{w,h:+s.ht||175,a:+s.age||30,m:s.sex!=='f',lbm:bf?w*(1-bf/100):0}}
function bmrWith(e,s){ // يرجع الرقم، أو null إن تعذّر (كتلة خالية مفقودة / عمر خارج النطاق)
  const b=bodyOf(s);
  if(e.type==='schof'){const t=b.a<10?null:b.a<18?SCH[1]:b.a<30?SCH[2]:b.a<60?SCH[3]:SCH[4];return t?(b.m?t[0]*b.w+t[1]:t[2]*b.w+t[3]):null}
  const k=b.m?e.m:e.f;if(!k)return null;
  if(+k.l&&!b.lbm)return null;
  return (+k.w||0)*b.w+(+k.h||0)*b.h+(+k.a||0)*b.a+(+k.l||0)*b.lbm+(+k.c||0);
}
function bmrCalc(s){
  const e=eqOf(s),v=bmrWith(e,s);if(v!=null)return{v};
  const mif=bmrWith(DEF_EQS[0],s),b=bodyOf(s);
  return{v:mif,fb:e.type==='schof'?(e.name+' لا تغطي هذا العمر — استُخدمت Mifflin-St Jeor'):(b.lbm?'تعذّر حساب '+e.name+' — استُخدمت Mifflin-St Jeor':'لا توجد نسبة دهون — استُخدمت Mifflin-St Jeor بدلاً من '+e.name)};
}
function goalCore(s){
  const w=+s.bw||70,b=bmrCalc(s),tdee=+s.tdeeM>0?+s.tdeeM:b.v*(+s.act||1.55);
  const gl=goalOf(s),g=s.g[gl.id],sign=gl.sign;
  let adj=0;
  if(sign){
    if(g.mode==='kcal')adj=sign*g.val;
    else if(g.mode==='rate')adj=sign*w*g.val/100*(sign<0?1100:7700/30); // 7700 سعرة ≈ 1 كجم؛ التنحيف %/أسبوع والزيادة %/شهر
    else adj=sign*tdee*g.val/100;
  }
  const k=Math.max(1000,tdee+adj),bf=+s.bf>0&&+s.bf<60?+s.bf:0,lbm=bf?w*(1-bf/100):0,flags=[];
  const p=g.pr*(g.prB==='lbm'&&lbm?lbm:w),f=g.fatM==='kg'?g.fat*w:k*g.fat/100/9;
  let c=(k-4*p-9*f)/4;
  if(c<0){c=0;flags.push('البروتين + الدهون يتجاوزان سعرات الهدف — خفّض أحدهما')}
  if(adj<0&&k<b.v)flags.push('سعرات الهدف أقل من BMR');
  if(f/w<0.5)flags.push('الدهون أقل من 0.5 جم/كجم');
  if(g.prB==='lbm'&&!lbm)flags.push('لا توجد نسبة دهون — حُسب البروتين على وزن الجسم');
  if(b.fb)flags.push(b.fb);
  return{bmr:b.v,tdee,adj,k,p,f,c,flags,rate:adj*7/7700};
}
function goalTargets(d){
  const s=S(),G=goalCore(s),nH=state.days.filter(x=>x.mode==='high').length,nL=7-nH;let c=G.c;
  if(s.cyc.on&&nH>0&&nL>0){const r=Math.min(1,Math.max(0,+s.cyc.r)),ch=G.c*7/(nH+r*nL);c=d.mode==='high'?ch:r*ch}
  return{p:G.p,c,f:G.f,k:4*G.p+4*c+9*G.f};
}
function legacyTargets(d){const s=state.settings,w=+s.bw||70;const p=w*s.pM,c=w*(d.mode==='high'?s.cH:s.cL),f=w*s.fM;return{p,c,f,k:4*p+4*c+9*f}}
function targets(d){const s=S();return goalOf(s).kind==='manual'?legacyTargets(d):goalTargets(d)}
function roundG(f,g){if(f.u&&f.ug)return Math.max(1,rd(g/f.ug))*f.ug;const st=g>=20?5:1;return Math.max(st,rd(g/st)*st)}

function fitDay(d,useCur){
  const items=d.meals.flatMap(m=>m.items),T=targets(d),fac={P:1,C:1,F:1};
  items.forEach(i=>{if(useCur)i.b=i.g;else i.g=i.b});
  for(let n=0;n<40;n++){
    for(const [R,m] of [['P','p'],['C','c'],['F','f']]){
      const cur=sum(items)[m];
      const grp=items.filter(i=>i.r===R);
      const contrib=grp.reduce((a,i)=>a+mac(i)[m],0);
      if(contrib<=0)continue;
      let s=1+(T[m]-cur)/contrib;s=Math.min(1.3,Math.max(0.75,s));
      fac[R]=Math.min(3,Math.max(0.25,fac[R]*s));
      grp.forEach(i=>i.g=i.b*fac[R]);
    }
  }
  items.forEach(i=>{const f=F(i.f);if(f&&!i.x)i.g=roundG(f,i.g)});
}
function buildDay(i,mode,prot){
  const meals=TPL[mode].map(m=>({n:m.n,items:m.it.map(([id,g,r,s])=>({f:id==='@prot'?PROT[prot]:id,g,b:g,r,s:s||''}))}));
  const d={name:DAYS[i],mode,prot,meals};fitDay(d);return d;
}
function defaultState(){
  const st={v:1,settings:{bw:70,pM:2,cH:2,cL:1,fM:0.8,by:'auto'},foods:FOODS0.map(a=>({id:a[0],n:a[1],grp:a[2],k:a[3],p:a[4],c:a[5],f:a[6],u:a[7]||'',ug:a[8]||0})),days:[]};
  state=st;
  DAYS.forEach((n,i)=>st.days.push(buildDay(i,i%2?'low':'high',i%2?'beef':'chicken')));
  return st;
}

const sg=x=>(x>0?'+':'')+rd(x);
// بحث عربي مرن: يتجاهل التشكيل والتطويل والهمزات والتاء المربوطة والألف المقصورة و«ال» التعريف، ويقبل عدة كلمات
const AR=s=>String(s==null?'':s).toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/(^|\s)ال(?=\S)/g,'$1');
function searchFoods(q,grp){
  const t=AR(q).split(/\s+/).filter(Boolean);
  return state.foods.map((f,ix)=>{
    if(grp&&f.grp!==grp)return null;
    const n=AR(f.n),ws=n.split(/\s+/),g=AR(GROUPS[f.grp]);let sc=0;
    for(const w of t){
      if(n.startsWith(w))sc+=3;else if(ws.some(x=>x.startsWith(w)))sc+=2;else if(n.includes(w))sc+=1;else if(g.includes(w))sc+=0.5;else return null;
    }

  }).filter(Boolean).sort((a,b)=>b.sc-a.sc||a.ix-b.ix).map(x=>x.f);

    <p class="note" style="margin:4px 0 0">الكارب = المتبقي من السعرات بعد البروتين والدهون.</p>

  <ul class="note" style="padding-inline-start:18px">
  <li>BMR: Mifflin-St Jeor الأكثر اعتماداً (≈82% من غير المصابين بالسمنة ضمن ±10% من القياس في إحدى المراجعات). Katch-McArdle وCunningham تعتمدان على الكتلة الخالية فتحتاجان نسبة دهون دقيقة.</li>
  <li>التنحيف: فقد 0.5–1% من وزن الجسم أسبوعياً للحفاظ على العضلات؛ بروتين 2.3–3.1 جم/كجم كتلة خالية؛ دهون 15–30% من السعرات (Helms وآخرون 2014، تحضير المسابقات).</li>

  <li>إظهار العضلات: الإعداد الافتراضي (عجز 10% وبروتين مرتفع) اجتهاد مقترح وليس رقماً منصوصاً في المصادر؛ عدّله حسب استجابتك.</li>

  </ul></details></div>`;
}

function vHist(){

  const mean=(arr,fn)=>arr.length?arr.reduce((a,x)=>a+fn(x),0)/arr.length:0;
  const av=src=>({k:mean(done,x=>src(x).k),p:mean(done,x=>src(x).p),c:mean(done,x=>src(x).c),f:mean(done,x=>src(x).f)});
  const aE=av(x=>x.L.eaten),aP=av(x=>x.L.plan),aT=av(x=>x.r.tg);

  const sk={},ex={n:0,k:0};let mv=0;

    if(e>0&&emOf(it,mi)!==mi)mv++;})));

  const r4=(l,t,cls)=>`<tr${cls?` class="${cls}"`:''}><td>${l}</td><td>${rd(t.k)}</td><td>${rd(t.p)}</td><td>${rd(t.c)}</td><td>${rd(t.f)}</td></tr>`;

  if(!rs.length)return h+`<p class="note">لا سجلات في هذه الفترة. سجّل ما تأكله من تبويب «اليوم» (✓ أو 📝) وسيُحفظ هنا بتاريخه.</p></div>`;
  h+=`<div class="dv"><span>أيام مسجّلة</span><b>${rs.length} (مكتملة ${n})</b></div>`;
  if(n){
    h+=`<table style="margin:6px 0"><tr><th>متوسط يوم مكتمل</th><th>سعرات</th><th>P</th><th>C</th><th>F</th></tr>${r4('الفعلي',aE,'avg')}${r4('الخطة',aP)}${r4('الهدف',aT)}<tr><td>الفعلي − الهدف</td><td>${dc(aE.k-aT.k,aT.k)}</td><td>${dc(aE.p-aT.p,aT.p)}</td><td>${dc(aE.c-aT.c,aT.c)}</td><td>${dc(aE.f-aT.f,aT.f)}</td></tr></table>

function act(a,ds){

  switch(a){
    case 'tab':ui.tab=ds.v;break;

    case 'rebuild':{const di=ui.day;ask('إعادة بناء اليوم من القالب؟ سيُفقد أي تعديل يدوي.',()=>{state.days[di]=buildDay(di,state.days[di].mode,state.days[di].prot)});return}
    case 'yes':{const f=modal.fn;modal=null;f();break}
    case 'qlog':{const it=d.meals[+ds.m].items[+ds.i];if(it.x)break;if(gE(it)==null){it.e=it.g;d.lw=weekKey()}else{delete it.e;delete it.em}break}
    case 'log':modal={type:'log',m:+ds.m,i:+ds.i};break;
    case 'logsave':case 'logskip':case 'logclr':{
      const H=modal.type==='hlog',r=H?getRec(modal.date):null,dd=H?r:d,its=dd.meals[modal.m].items,it=its[modal.i],f=FOOD(it),u=f.u&&f.ug?f.ug:1;
      if(a==='logsave'){const q=Math.max(0,+$('#lq').value||0),mm=+$('#lm').value;it.e=q*u;if(mm===modal.m)delete it.em;else it.em=mm}
      else if(a==='logskip'){it.e=0;delete it.em}
      else if(it.x)its.splice(modal.i,1);else{delete it.e;delete it.em}
      if(H){r.ts=Date.now();hPut(meta.cur,r);modal={type:'hdetail',date:r.date}}else{if(a!=='logclr')dd.lw=weekKey();modal=null}
      break}
    case 'hopen':modal={type:'hdetail',date:ds.d};break;
    case 'hlog':modal={type:'hlog',date:ds.d,m:+ds.m,i:+ds.i};break;
    case 'hdel':{const dt=ds.d;ask('حذف سجل '+dateLabel(dt)+' نهائياً؟',()=>hDel(meta.cur,dt));return}
    case 'hr':ui.hr=ds.v;break;

    case 'cmp':modal={type:'cmp'};break;

    case 'logclear':{const di=ui.day;ask('مسح تسجيل «'+d.name+'» (المأكول والمنقول والأصناف الإضافية)؟',()=>clearLog(state.days[di]));return}
    case 'uadd':modal={type:'user',mode:'add',name:''};break;
    case 'uren':modal={type:'user',mode:'ren',name:curUser().name};break;
    case 'usave':{const n=($('#un').value||'').trim();if(!n){toast('اكتب الاسم');return}
      if(modal.mode==='add'){const cp=!!($('#ucopy')&&$('#ucopy').checked);modal=null;addUser(n,cp);toast('تم إنشاء المستخدم')}
      else{curUser().name=n;modal=null}

function parseLabel(raw){
  const T=String(raw||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫٬]/g,'.').replace(/(\d),(\d)/g,'$1.$2').replace(/\d+(?:\.\d+)?\s*%/g,' ');
  const lines=T.split(/\n+/).map(x=>x.trim()).filter(Boolean),N=/\d+(?:\.\d+)?/g,warn=[];
  let col=0;for(const l of lines){const a=l.search(/serving|portion|الحصة|الحصه|حصة/i),b=l.search(/100\s*(?:g|gm|ml|جم|غ|غرام|مل)/i);if(a>=0&&b>=0){col=a<b?1:0;break}}
  const pick=(re,skip,after)=>{for(const l of lines){if(skip&&skip.test(l))continue;const m=l.match(re);if(!m)continue;
    const rest=l.slice(m.index+m[0].length),ts=[...rest.matchAll(/(\d+(?:\.\d+)?)(\s*(?:g|gm|ml|جم|غ|غرام|مل)\b)?/gi)].map(x=>{let n=+x[1];
      if(!x[2]&&/^\d+\.\d9$/.test(x[1])){n=+x[1].slice(0,-1);warn.push('صُحّح '+x[1]+' إلى '+n+' (الحرف g قُرئ كـ 9)')}return n});
    if(ts.length)return ts[col]!=null?ts[col]:ts[0]}return null};
  // الطاقة
  let k=null;
  for(const l of lines){if(!/energy|calor|kcal|cal\b|كالور|سعر|طاقة|طاقه/i.test(l))continue;
    const ks=[...l.matchAll(/(\d+(?:\.\d+)?)\s*(?:k\s?c[ae]?[a-z]?l|cal\b|كيلو|كالور|سعر)/gi)].map(m=>+m[1]);
    if(ks.length){k=ks[col]!=null?ks[col]:ks[0];break}
    const kj=[...l.matchAll(/(\d+(?:\.\d+)?)\s*kj/gi)].map(m=>+m[1]);
    if(kj.length){k=Math.round((kj[col]!=null?kj[col]:kj[0])/4.184);warn.push('الطاقة كانت بالكيلوجول وحُوّلت إلى سعرات');break}}
  if(k==null)k=pick(/calor|energy|سعر|كالور|طاقة|طاقه/i);
  const p=pick(/protein|بروتين/i),c=pick(/carbohydrate|carbs?\b|كربوهيدرات|كاربوهيدرات|نشويات/i);
  let f=pick(/total\s*fat|إجمالي\s*الدهون|اجمالي\s*الدهون|الدهون\s*الكلية/i);
  if(f==null)f=pick(/fat|دهون|دهن/i,/saturat|trans|mono|poly|مشبع|متحول|sat\./i);
  // الأساس: لكل 100 جم أو لكل حصة
  let ug=null;
  for(const l of lines){if(!/serving|portion|الحصة|الحصه|حصة|وزن\s*القطعة/i.test(l))continue;const m=l.match(/(\d+(?:\.\d+)?)\s*(?:g|gm|ml|جم|غ|غرام|مل)\b/i);if(m){ug=+m[1];break}}
  const has100=/(?:per|\/|في|لكل|لـ|بـ)?\s*100\s*(?:g|gm|ml|جم|غ|غرام|مل)/i.test(T);
  const fields={};let msg;
  if(k!=null)fields.k=k;if(p!=null)fields.p=p;if(c!=null)fields.c=c;if(f!=null)fields.f=f;
  if(has100||!ug){fields.b='g';if(!has100)warn.push('لم أتعرّف على الأساس (100 جم أم حصة)؛ افترضتُ لكل 100 جم')}
  else{fields.b='u';fields.u='حصة';fields.ug=ug;warn.push('القيم لكل حصة ('+ug+' جم)')}
  const miss=['k','p','c','f'].filter(x=>fields[x]==null).map(x=>({k:'السعرات',p:'البروتين',c:'الكارب',f:'الدهون'}[x]));
  if(miss.length)warn.push('لم أجد: '+miss.join('، '));
  if(fields.k>0&&fields.p!=null&&fields.c!=null&&fields.f!=null){const est=4*fields.p+4*fields.c+9*fields.f;if(Math.abs(est-fields.k)/fields.k>0.25)warn.push('السعرات لا تطابق الماكروز (≈'+Math.round(est)+')؛ تحقق من الأرقام')}
  msg=(Object.keys(fields).length>1?'تمت التعبئة — راجع القيم قبل الإضافة. ':'لم أجد قيماً غذائية في النص. ')+warn.join(' · ');
  return{fields,msg,warn};
}

  const now=new Date().toISOString(),U=[],D=[],H=[];
  meta.users.forEach(u=>{const st=u.id===meta.cur?state:loadUser(u.id);if(!st)return;
    U.push({owner:uid,id:u.id,name:u.name,settings:st.settings,foods:st.foods,updated_at:now});
    st.days.forEach((d,i)=>D.push({owner:uid,user_id:u.id,idx:i,data:d,updated_at:now}));
    hAll(u.id).forEach(r=>H.push({owner:uid,user_id:u.id,date:r.date,data:r,updated_at:now}));});
  await cUpsert('mp_users',U,'owner,id');await cUpsert('mp_days',D,'owner,user_id,idx');await cUpsert('mp_history',H,'owner,user_id,date');
  // تنظيف ما حُذف محلياً (مستخدمون، وأيام سجل)
  const ids=meta.users.map(u=>u.id);
  await cFetch('/rest/v1/mp_users?id=not.in.('+ids.map(ENC).join(',')+')',{method:'DELETE'});
  for(const u of meta.users){const ds=hIdx(u.id);
    await cFetch('/rest/v1/mp_history?user_id=eq.'+ENC(u.id)+(ds.length?'&date=not.in.('+ds.join(',')+')':''),{method:'DELETE'})}
  return 'تم الرفع '+new Date().toLocaleTimeString('ar')+' — '+U.length+' مستخدم، '+H.length+' يوم سجل';
}
async function cAll(table,order){let out=[],off=0;for(;;){const r=await cFetch('/rest/v1/'+table+'?select=*&order='+order+'&limit=1000&offset='+off);out=out.concat(r||[]);if(!r||r.length<1000)break;off+=1000}return out}
async function cPull(){
  const U=await cAll('mp_users','id'),D=await cAll('mp_days','user_id,idx'),H=await cAll('mp_history','user_id,date');
  if(!U.length)return 'لا توجد بيانات في السحابة بعد — ارفع أولاً';
  const users=U.map(u=>{const days=Array(7).fill(null);D.filter(x=>x.user_id===u.id).forEach(x=>days[x.idx]=x.data);
    return{id:u.id,name:u.name,data:{settings:u.settings,foods:u.foods,days},hist:H.filter(x=>x.user_id===u.id).map(x=>x.data)}}).filter(u=>validUser(u.data));
  if(!users.length)return 'بيانات السحابة غير مكتملة (أيام ناقصة)';
  ask('تنزيل '+users.length+' مستخدم من السحابة سيستبدل كل بياناتك المحلية. متابعة؟',()=>restoreAll({meta:{cur:meta.cur},users}));
  return 'بانتظار تأكيدك';
}
let cT=null;function cSched(){clearTimeout(cT);cT=setTimeout(()=>cRun(cPush),4000)}
function restoreAll(o){
  meta.users.forEach(u=>wipeUser(u.id));
  const cur=o.meta&&o.users.some(u=>u.id===o.meta.cur)?o.meta.cur:o.users[0].id;
  meta={users:o.users.map(u=>({id:u.id,name:u.name||'مستخدم'})),cur};
  o.users.forEach(u=>{saveUser(u.id,u.data);(Array.isArray(u.hist)?u.hist:[]).forEach(r=>{if(r&&r.date)hPut(u.id,r)})});
  state=o.users.find(u=>u.id===cur).data;
}
$('#file').addEventListener('change',e=>{
  const fl=e.target.files[0];if(!fl)return;
  const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);
    if(o&&o.v===2&&Array.isArray(o.users)&&o.users.length&&o.users.every(u=>u.id&&validUser(u.data))){
      ask('الاستيراد يستبدل كل المستخدمين الحاليين. متابعة؟',()=>restoreAll(o));
    }else if(validUser(o)){const id=uid();meta.users.push({id,name:'مستورد'});meta.cur=id;state=o;save();render();toast('تم الاستيراد كمستخدم جديد')}
    else throw 0;
  }catch(x){toast('ملف غير صالح')}};
  r.readAsText(fl);e.target.value='';
});
state=load();
if(!state){state=defaultState();const id=uid();meta={users:[{id,name:'المستخدم 1'}],cur:id};save()}
// إصلاح تلقائي لأصناف الوحدات المضافة بالخطأ (قيمة القطعة كُتبت كأنها لكل 100 جم)
(function(){const fx=[];state.foods.forEach(f=>{
  if(String(f.id).startsWith('c')&&f.u&&+f.ug>0&&!f.fixed&&f.k*f.ug/100<8&&f.k>0){
    const m=100/f.ug;f.k*=m;f.p*=m;f.c*=m;f.f*=m;f.fixed=1;fx.push(f.n)}
  });
  if(fx.length){save();setTimeout(()=>toast('تم تصحيح سعرات: '+fx.join('، ')),400)}})();
if(rollWeek())save();
render();
if(/access_token=/.test(location.hash))cHash().then(r=>{if(r||ui.tab==='set')render()});
</script>
