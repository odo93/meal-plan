<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إدارة نظام الوجبات</title>
<style>
:root{--bg:#f5f5f6;--card:#fff;--tx:#1b1b1f;--mu:#636366;--ac:#f5a623;--on-ac:#2b1a00;--act:#8a5700;--ac2:#fff1d6;--ln:#e8e8ec;--ok:#1f7a45;--hi:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.top{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1}h1 small{display:block;font-size:12px;font-weight:400;color:var(--mu)}
nav{max-width:960px;margin:0 auto;padding:0 12px 8px;display:flex;gap:6px;overflow-x:auto}
nav button{border:0;background:#f0f0f2;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;color:var(--tx);cursor:pointer;white-space:nowrap;min-height:40px}
nav button[aria-current="page"]{background:var(--ac);color:var(--on-ac)}
main{max-width:960px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 48px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:16px;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.stat span{color:var(--mu);font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px;margin:8px 0}
input,select,textarea{font:inherit;border:1px solid var(--ln);border-radius:10px;padding:9px 10px;background:#fff;color:var(--tx);width:100%;min-height:44px}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;direction:ltr}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:1px solid var(--ac);background:#fff;color:var(--act);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.btn.pri{background:var(--ac);color:var(--on-ac)}.btn.dan{border-color:var(--hi);color:var(--hi)}
.btn:disabled{opacity:.5;cursor:default}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:start;vertical-align:middle}
th{color:var(--mu);font-weight:600;font-size:12px}
td.n{font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;background:#e3f5ea;color:var(--ok)}.pill.off{background:#f0f0f2;color:var(--mu)}.pill.warn{background:#fde8e8;color:var(--hi)}
.note{font-size:13px;color:var(--mu);margin:4px 0}
#msg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:calc(100% - 32px)}
.login{max-width:380px;margin:40px auto}
table.mx{min-width:0}.mx th{font-size:11px;padding:6px 2px}.mx td{padding:6px 2px}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:start}
.mx input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ac)}
.mx input:not([type=checkbox]),.mx select{min-height:38px;padding:6px 8px}
tr.ed td{background:var(--ac2)}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
</style>
</head>
<body>
<header><div class="top"><h1>لوحة الإدارة<small id="who"></small></h1><a class="btn" href="../v2/">فتح التطبيق</a></div><nav id="nav" aria-label="أقسام الإدارة"></nav></header>
<main id="app"></main>
<div id="msg" role="status" aria-live="polite"></div>
<script>
// لوحة الإدارة: كل صلاحية تتحقق منها قاعدة البيانات (is_admin في سياسات RLS والدوال)، والصفحة لا تحمل أي سر.
const SB={url:'https://exznecnhvsihdelwsibv.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4em5lY25odnNpaGRlbHdzaWJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTY4NzAsImV4cCI6MjEwOTE3Mjg3MH0.8TP92hVmjHt9KrnaWzWDWvzdgBIctk2BkBphxjzRCK0'};
const SK='mp3_admin_sess';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const GRPS={pro:'بروتين',dairy:'ألبان',carb:'كارب',fruit:'فاكهة',fat:'دهون',veg:'خضار'};
// يجب أن تطابق التطبيق (v2/js/views-me.js وgoals.js) — الاختبار admin-control يتحقق
const FEATS=[['scan','المسح بالصورة والباركود'],['online','البحث أونلاين (USDA وOpen Food Facts)'],['shop','قائمة المشتريات'],['multi','أكثر من ملف (أفراد وأطفال)'],['share','المشاركة بكود'],['clients','متدربيني']];
const MODES=[['self','لنفسي'],['family','لي ولعائلتي'],['coach','مدرب مستقل'],['org','مؤسسة']];
const GOALS=[['manual','كارب أقل'],['cut','تنحيف'],['maint','تثبيت'],['recomp','إظهار العضلات'],['bulk','زيادة وزن'],['lean','بناء عضلات']];
const ACTS=[[1.2,'خامل'],[1.375,'خفيف'],[1.55,'متوسط'],[1.725,'عالٍ'],[1.9,'شديد']];
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],PAT0=['high','low','high','low','high','low','high'];
const GD={cut:{val:0.75,u:'كجم/أسبوع عجز',pr:2.2,fat:25},maint:{pr:1.8,fat:25},recomp:{val:10,u:'% عجز',pr:2.2,fat:25},bulk:{val:15,u:'% فائض',pr:1.6,fat:25},lean:{val:7,u:'% فائض',pr:2.2,fat:25}};
const TABS=[['stats','نظرة عامة'],['insights','الرؤى'],['accounts','الحسابات'],['ann','الإعلانات'],['config','إعدادات التطبيق'],['foods','الأصناف المشتركة']];
let sess=lsGet(SK),ui={tab:'stats',busy:false},data={};
function msg(t){const e=$('#msg');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',3500)}
async function api(path,o){o=o||{};
  if(sess&&!o.anon&&sess.exp-Date.now()<60000){const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',anon:true,body:{refresh_token:sess.rt}});setSess(j)}
  const h={apikey:SB.key,'Content-Type':'application/json',Authorization:'Bearer '+(o.anon||!sess?SB.key:sess.at)};
  if(o.prefer)h.Prefer=o.prefer;
  const r=await fetch(SB.url+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status);throw new Error(/not_admin/.test(m)?'هذا الحساب ليس مديراً':m)}
  return j;
}
function setSess(j){sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||(sess&&sess.email)||''};lsSet(SK,sess)}
const rpc=(n,b)=>api('/rest/v1/rpc/'+n,{method:'POST',body:b||{}});
const fmtD=d=>d?new Date(d).toLocaleDateString('ar',{day:'numeric',month:'short',year:'numeric'}):'—';

async function load(tab){ui.busy=true;render();
  try{
    if(tab==='stats')data.stats=await rpc('admin_stats');
    if(tab==='accounts')data.accounts=await rpc('admin_accounts');
    if(tab==='insights')data.ins=await rpc('admin_insights',{p_days:+(ui.insDays||90)});
    if(tab==='ann')data.ann=await api('/rest/v1/announcements?select=*&order=id.desc');
    if(tab==='config')data.cfg=(await api('/rest/v1/app_config?select=*&id=eq.1'))[0];
    if(tab==='foods')data.foods=await api('/rest/v1/shared_foods?select=*&order=grp,n');
  }catch(e){msg(e.message)}
  ui.busy=false;render();
}
function vLogin(){return `<div class="card login"><h2>دخول المدير</h2><p class="note">استخدم نفس حساب التطبيق. الدخول متاح للمديرين فقط.</p>
  <form id="lf"><label>البريد<input id="em" type="email" autocomplete="username" dir="ltr" required></label><label>كلمة المرور<input id="pw" type="password" autocomplete="current-password" dir="ltr" required></label>
  <div class="btns"><button class="btn pri" type="submit">دخول</button></div><p class="note" id="lmsg"></p></form></div>`}
function vStats(){const s=data.stats;if(!s)return '<p class="note">جارٍ التحميل…</p>';
  const c=[['accounts','كل الحسابات'],['registered','حسابات ببريد'],['anonymous','حسابات مؤقتة'],['active_7d','نشطة آخر 7 أيام'],['people','ملفات أشخاص'],['history_days','أيام في السجل'],['active_grants','مشاركات مفعّلة'],['pending_grants','دعوات بانتظار القبول'],['archived_days','أيام في الأرشيف'],['deleted_accounts','حسابات حُذفت']];
  return `<div class="stats">${c.map(([k,l])=>`<div class="stat"><b>${esc(s[k])}</b><span>${l}</span></div>`).join('')}</div>`}
const modeName=m=>(MODES.find(x=>x[0]===m)||[0,'لم يُحدَّد'])[1];
function vAccounts(){const A=data.accounts;if(!A)return '<p class="note">جارٍ التحميل…</p>';
  const ov=a=>Object.keys(a.features||{}).filter(k=>FEATS.some(f=>f[0]===k));
  const edit=a=>`<div class="card" id="acc_ed"><h2>تعديل <span dir="ltr">${a.anon?'حساب مؤقت':esc(a.email)}</span></h2><form id="acf" data-id="${esc(a.id)}"><div class="row"><label>نوع الاستخدام<select id="ac_m"><option value="">بدون تغيير (${esc(modeName(a.mode))})</option>${MODES.map(([v,l])=>`<option value="${v}" ${a.mode===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <div class="tbl"><table class="mx" style="min-width:0"><thead><tr><th>الميزة لهذا الحساب</th><th>الحالة</th></tr></thead><tbody>${FEATS.map(([k,l])=>{const v=(a.features||{})[k];return `<tr><td>${l}</td><td><select id="ac_f_${k}" aria-label="${l}"><option value="">حسب نوع الاستخدام</option><option value="1" ${v===true?'selected':''}>مفعّلة دائماً</option><option value="0" ${v===false?'selected':''}>مغلقة</option></select></td></tr>`}).join('')}</tbody></table></div>
    <div class="btns"><button class="btn pri" type="submit">حفظ</button><button class="btn" type="button" data-act="acclose">إلغاء</button></div><p class="note">الاستثناء يتقدّم على إعداد نوع الاستخدام. يصل للمستخدم عند فتح التطبيق وهو مسجّل الدخول.</p></form></div>`;
  const cur=A.find(a=>a.id===ui.acc);
  return `${cur?edit(cur):''}<div class="card"><h2>الحسابات (${A.length})</h2><div class="tbl"><table><thead><tr><th>البريد</th><th>الجوال</th><th>النوع</th><th>استثناءات</th><th>التسجيل</th><th>آخر دخول</th><th>الملفات</th><th>آخر تحديث</th><th></th></tr></thead><tbody>
  ${A.map(a=>`<tr><td dir="ltr" style="text-align:end">${a.anon?'<span class="pill off">حساب مؤقت</span>':esc(a.email)}${a.is_admin?' <span class="pill">مدير</span>':''}${a.confirmed===false&&!a.anon?' <span class="pill warn">لم يفعّل البريد</span>':''}</td><td dir="ltr" style="text-align:end">${esc(a.phone||'—')}</td><td>${esc(modeName(a.mode))}</td><td>${ov(a).length?ov(a).map(k=>`<span class="pill ${a.features[k]?'':'warn'}">${esc((FEATS.find(f=>f[0]===k)||[0,k])[1])}${a.features[k]?'':' ✕'}</span>`).join(' '):'—'}</td><td>${fmtD(a.created_at)}</td><td>${fmtD(a.last_sign_in_at)}</td><td class="n">${esc(a.people)}</td><td>${fmtD(a.last_update)}</td><td><button class="btn" data-act="acedit" data-id="${esc(a.id)}">تعديل</button></td></tr>`).join('')}</tbody></table></div></div>`}
function vInsights(){const I=data.ins;if(!I)return '<p class="note">جارٍ التحميل…</p>';
  const per=ui.insDays||90,ch=(v,l)=>`<button class="btn${per==v?' pri':''}" data-act="insd" data-v="${v}">${l}</button>`;
  const lst=(t,a,unit)=>`<div class="card"><h2>${t}</h2>${a&&a.length?`<div class="tbl"><table style="min-width:0"><tbody>${a.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${esc(x.c)} ${unit||'مرة'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">لا بيانات بعد.</p>'}</div>`;
  const bar=(v,max)=>`<span style="display:inline-block;height:10px;border-radius:5px;background:var(--ac);width:${Math.max(2,Math.round(v/Math.max(1,max)*100))}%;vertical-align:middle"></span>`;
  const dows=I.by_dow||[],wk=I.weekly||[],wmax=Math.max(1,...wk.map(x=>x.days));
  const gName=g=>(GOALS.find(x=>x[0]===g)||[0,g])[1],mName=m=>m==='none'?'لم يحدَّد':modeName(m);
  return `<div class="btns" style="margin:0 0 8px">${ch(30,'30 يوماً')}${ch(90,'90 يوماً')}${ch(365,'سنة')}</div>
  <p class="note">مجمّعة من كل الحسابات ومن الأرشيف، بلا أسماء ولا بريد.</p>
  <div class="stats"><div class="stat"><b>${esc(I.days)}</b><span>يوماً مسجّلاً</span></div><div class="stat"><b>${esc(I.weights)}</b><span>ملفات تسجّل الوزن</span></div></div>
  <div class="card"><h2>الالتزام حسب يوم الأسبوع</h2>${dows.length?`<div class="tbl"><table style="min-width:0"><tbody>${dows.map(x=>`<tr><td>${DAYS[x.dow]}</td><td style="width:55%">${bar(x.adh,150)}</td><td class="n">${x.adh}%</td><td class="n note">${x.n} يوم</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">لا بيانات بعد.</p>'}</div>
  <div class="card"><h2>أيام مسجّلة أسبوعياً</h2>${wk.length?`<div class="tbl"><table style="min-width:0"><tbody>${wk.map(x=>`<tr><td dir="ltr" style="text-align:end">${esc(x.wk)}</td><td style="width:60%">${bar(x.days,wmax)}</td><td class="n">${x.days}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">لا بيانات بعد.</p>'}</div>
  ${lst('أكثر الأصناف أكلاً',I.top_eaten)}${lst('أكثر الأصناف تركاً',I.top_skipped)}${lst('أكثر ما يُؤكل خارج الخطة',I.extra)}
  ${lst('الأهداف',(I.goals||[]).map(x=>({n:gName(x.goal),c:x.c})),'ملف')}${lst('أنواع الاستخدام',(I.modes||[]).map(x=>({n:mName(x.mode),c:x.c})),'حساب')}`}
function vAnn(){const A=data.ann||[];
  return `<div class="card"><h2>إعلان جديد</h2><form id="af"><label>العنوان<input id="a_t" required maxlength="80"></label><label>النص<input id="a_b" maxlength="240"></label>
  <div class="row"><label>النوع<select id="a_l"><option value="info">معلومة</option><option value="warn">تنبيه</option></select></label><label>ينتهي في (اختياري)<input id="a_e" type="date"></label></div>
  <div class="btns"><button class="btn pri" type="submit">نشر الإعلان</button></div><p class="note">يظهر لكل المستخدمين أعلى التطبيق حتى يخفيه كل واحد، أو حتى تاريخ الانتهاء.</p></form></div>
  <div class="card"><h2>الإعلانات (${A.length})</h2>${A.length?`<div class="tbl"><table><thead><tr><th>العنوان</th><th>النوع</th><th>الحالة</th><th>ينتهي</th><th></th></tr></thead><tbody>
  ${A.map(a=>`<tr><td><b>${esc(a.title)}</b><div class="note">${esc(a.body)}</div></td><td>${a.level==='warn'?'<span class="pill warn">تنبيه</span>':'معلومة'}</td><td>${a.active?'<span class="pill">ظاهر</span>':'<span class="pill off">مخفي</span>'}</td><td>${fmtD(a.ends_at)}</td>
  <td><div class="btns" style="margin:0"><button class="btn" data-act="atog" data-id="${a.id}" data-v="${a.active?0:1}">${a.active?'إخفاء':'إظهار'}</button><button class="btn dan" data-act="adel" data-id="${a.id}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">لا توجد إعلانات.</p>'}</div>`}
function vConfig(){const c=data.cfg;if(!c)return '<p class="note">جارٍ التحميل…</p>';
  return `<div class="card"><h2>الإصدارات</h2><form id="cf"><div class="row"><label>أحدث إصدار<input id="c_l" value="${esc(c.latest_version)}" dir="ltr" pattern="[0-9.]+" required></label><label>أقل إصدار مسموح<input id="c_m" value="${esc(c.min_version)}" dir="ltr" pattern="[0-9.]+" required></label></div>
  <p class="note">من يفتح نسخة أقدم من «أقل إصدار مسموح» يرى «تحديث مطلوب». رقم الإصدار في التطبيق هو APP_VER.</p>
  <div class="btns"><button class="btn pri" type="submit">حفظ</button></div><p class="note">آخر تعديل: ${fmtD(c.updated_at)}</p></form></div>
  ${vFeatures(c)}${vDefaults(c)}${vConn()}`}
function vConn(){return `<div class="card"><h2>الاتصال بقاعدة البيانات</h2><p class="note">يستخدمه التطبيق ولوحة الإدارة ثابتاً، ولا يظهر للمستخدمين. المفتاح العام (anon) مسموح ظهوره في الصفحة؛ الحماية في سياسات RLS. لا تضع مفتاح service_role في أي صفحة أبداً.</p>
  <label>رابط المشروع<input id="cn_url" dir="ltr" readonly value="${esc(SB.url)}"></label>
  <label>المفتاح العام (anon)<textarea id="cn_key" dir="ltr" readonly rows="3" style="min-height:0;font-size:12px">${esc(SB.key)}</textarea></label>
  <div class="btns"><button class="btn" type="button" data-act="copy" data-v="cn_url">نسخ الرابط</button><button class="btn" type="button" data-act="copy" data-v="cn_key">نسخ المفتاح</button></div></div>`}
function vFeatures(c){const F=c.features||{};const on=(k,m)=>!(F[k]&&F[k][m]===false);
  return `<div class="card"><h2>الميزات حسب نوع الاستخدام</h2><form id="cff"><div class="tbl"><table class="mx"><thead><tr><th>الميزة</th>${MODES.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
  ${FEATS.map(([k,l])=>`<tr><td>${l}</td>${MODES.map(([m,ml])=>`<td><input type="checkbox" id="ft_${k}_${m}" aria-label="${l} — ${ml}" ${on(k,m)?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="btns"><button class="btn pri" type="submit">حفظ الميزات</button></div><p class="note">الميزة المغلقة تختفي من التطبيق لأصحاب هذا النوع. «متدربيني» يظهر أصلاً للمدرب والمؤسسة فقط. تسجيل الدخول والمزامنة لا تُغلق. لاستثناء حساب بعينه: «الحسابات» ← «تعديل».</p></form></div>`}
function vDefaults(c){const D=c.defaults||{},G=D.g||{},val=(g,k)=>G[g]&&G[g][k]!=null?esc(G[g][k]):'';
  return `<div class="card"><h2>الإعدادات الافتراضية للأشخاص الجدد</h2><form id="cfd"><div class="row">
  <label>الهدف<select id="d_goal"><option value="">افتراضي التطبيق (كارب أقل)</option>${GOALS.map(([v,l])=>`<option value="${v}" ${D.goal===v?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>مستوى النشاط<select id="d_act"><option value="">افتراضي التطبيق (متوسط)</option>${ACTS.map(([v,l])=>`<option value="${v}" ${+D.act===v?'selected':''}>${l} ×${v}</option>`).join('')}</select></label></div>
  <div class="tbl"><table class="mx"><thead><tr><th>الهدف</th><th>العجز / الفائض</th><th>بروتين جم/كجم</th><th>دهون %</th></tr></thead><tbody>
  ${Object.keys(GD).map(g=>`<tr><td>${(GOALS.find(x=>x[0]===g)||[0,g])[1]}</td><td>${GD[g].val!=null?`<input id="d_${g}_val" type="number" step="any" min="0" max="100" inputmode="decimal" placeholder="${GD[g].val}" value="${val(g,'val')}" aria-label="${GD[g].u}"><div class="note">${GD[g].u}</div>`:'—'}</td><td><input id="d_${g}_pr" type="number" step="any" min="0" max="5" inputmode="decimal" placeholder="${GD[g].pr}" value="${val(g,'pr')}" aria-label="بروتين"></td><td><input id="d_${g}_fat" type="number" step="any" min="0" max="60" inputmode="decimal" placeholder="${GD[g].fat}" value="${val(g,'fat')}" aria-label="دهون"></td></tr>`).join('')}</tbody></table></div>
  ${(()=>{const C=D.cyc||{},pat=Array.isArray(C.pat)&&C.pat.length===7?C.pat:PAT0;return `<h3 style="font-size:15px;margin:14px 0 4px">دورة الكارب ونمط الأسبوع</h3>
  <div class="row"><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="d_cyc_on" style="width:auto;min-height:0" ${C.on===false?'':'checked'}> تفعيل دورة الكارب</label>
  <label>كارب اليوم القليل % من العادي<input id="d_cyc_r" type="number" min="0" max="100" step="5" inputmode="numeric" placeholder="50" value="${C.r!=null?Math.round(C.r*100):''}"></label></div>
  <div class="tbl"><table class="mx"><thead><tr>${DAYS.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody><tr>${DAYS.map((n,i)=>`<td><label style="margin:0;align-items:center;font-weight:400;font-size:11px"><input type="checkbox" id="d_pat_${i}" ${pat[i]==='low'?'checked':''} aria-label="${n} كارب قليل">قليل</label></td>`).join('')}</tr></tbody></table></div>`})()}
  <div class="btns"><button class="btn pri" type="submit">حفظ الافتراضيات</button></div><p class="note">تُطبَّق على الأشخاص الجدد وعلى الأهداف التي لم يضبطها المستخدم بعد، ولا تغيّر ما ضبطه أحد. الخانة الفارغة = قيمة التطبيق الظاهرة.</p></form></div>`}
function vFoods(){const F=data.foods||[];
  return `<div class="card"><h2>صنف جديد</h2><form id="ff"><div class="row"><label>الاسم<input id="f_n" required></label><label>المجموعة<select id="f_g">${Object.keys(GRPS).map(k=>`<option value="${k}">${GRPS[k]}</option>`).join('')}</select></label></div>
  <div class="row">${[['k','سعرات'],['p','بروتين'],['c','كارب'],['f','دهون']].map(([k,l])=>`<label>${l} / 100 جم<input id="f_${k}" type="number" step="any" min="0" required></label>`).join('')}</div>
  <div class="row"><label>الوحدة (اختياري)<input id="f_u" placeholder="حبة"></label><label>وزن الوحدة جم<input id="f_ug" type="number" step="any" min="0"></label></div>
  <div class="btns"><button class="btn pri" type="submit">إضافة</button></div><p class="note">تظهر الأصناف المشتركة لكل المستخدمين ضمن «القاعدة الجاهزة» في البحث.</p></form></div>
  <div class="card"><h2>الأصناف المشتركة (${F.length})</h2>${F.length?`<div class="tbl"><table><thead><tr><th>الصنف</th><th>المجموعة</th><th>سعرات</th><th>P</th><th>C</th><th>F</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${F.map(f=>`<tr><td>${esc(f.n)}${f.u?`<div class="note">${esc(f.u)} = ${esc(f.ug)} جم</div>`:''}</td><td>${GRPS[f.grp]}</td><td class="n">${esc(f.k)}</td><td class="n">${esc(f.p)}</td><td class="n">${esc(f.c)}</td><td class="n">${esc(f.f)}</td><td>${f.active?'<span class="pill">ظاهر</span>':'<span class="pill off">مخفي</span>'}</td>
  <td><div class="btns" style="margin:0"><button class="btn" data-act="ftog" data-id="${esc(f.id)}" data-v="${f.active?0:1}">${f.active?'إخفاء':'إظهار'}</button><button class="btn dan" data-act="fdel" data-id="${esc(f.id)}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">لا توجد أصناف مشتركة بعد.</p>'}</div>`}
function render(){
  $('#who').textContent=sess?(sess.email||'')+(ui.admin===false?' · ليس مديراً':''):'';
  $('#nav').innerHTML=sess&&ui.admin?TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" ${ui.tab===k?'aria-current="page"':''}>${l}</button>`).join('')+'<button data-act="out">خروج</button>':'';
  if(!sess){$('#app').innerHTML=vLogin();return}
  if(ui.admin===false){$('#app').innerHTML=`<div class="card login"><h2>لا توجد صلاحية</h2><p class="note">الحساب ${esc(sess.email)} ليس ضمن مديري التطبيق.</p><div class="btns"><button class="btn" data-act="out">تسجيل الخروج</button></div></div>`;return}
  if(ui.admin==null){$('#app').innerHTML='<p class="note">جارٍ التحقق من الصلاحية…</p>';return}
  $('#app').innerHTML={insights:vInsights,stats:vStats,accounts:vAccounts,ann:vAnn,config:vConfig,foods:vFoods}[ui.tab]();
}
async function boot(){render();if(!sess)return;
  try{ui.admin=!!(await rpc('is_admin'))}catch(e){ui.admin=false;msg(e.message)}
  render();if(ui.admin)load(ui.tab);
}
async function run(fn,ok){try{await fn();if(ok)msg(ok);await load(ui.tab)}catch(e){msg('خطأ: '+e.message)}}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='lf'){const b=f.querySelector('button');b.disabled=true;
    try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',anon:true,body:{email:$('#em').value.trim(),password:$('#pw').value}});setSess(j);ui.admin=null;boot()}
    catch(x){$('#lmsg').textContent=/Invalid login/i.test(x.message)?'البريد أو كلمة المرور غير صحيحة':x.message;b.disabled=false}}
  if(f.id==='af')run(()=>api('/rest/v1/announcements',{method:'POST',prefer:'return=minimal',body:{title:$('#a_t').value.trim(),body:$('#a_b').value.trim(),level:$('#a_l').value,ends_at:$('#a_e').value?new Date($('#a_e').value+'T23:59:59').toISOString():null}}),'نُشر الإعلان');
  if(f.id==='cf')run(()=>api('/rest/v1/app_config?id=eq.1',{method:'PATCH',prefer:'return=minimal',body:{latest_version:$('#c_l').value.trim(),min_version:$('#c_m').value.trim(),updated_at:new Date().toISOString()}}),'تم حفظ الإصدارات');
  if(f.id==='cff'){const ft={};FEATS.forEach(([k])=>{const o={};MODES.forEach(([m])=>{o[m]=$('#ft_'+k+'_'+m).checked});ft[k]=o});
    run(()=>api('/rest/v1/app_config?id=eq.1',{method:'PATCH',prefer:'return=minimal',body:{features:ft,updated_at:new Date().toISOString()}}),'تم حفظ الميزات')}
  if(f.id==='cfd'){const D={},g={};if($('#d_goal').value)D.goal=$('#d_goal').value;if($('#d_act').value)D.act=+$('#d_act').value;
    Object.keys(GD).forEach(k=>{const o={};['val','pr','fat'].forEach(x=>{const e=$('#d_'+k+'_'+x);if(e&&e.value!=='')o[x]=+e.value});if(Object.keys(o).length)g[k]=o});if(Object.keys(g).length)D.g=g;
    const r=$('#d_cyc_r').value;D.cyc={on:$('#d_cyc_on').checked,pat:[0,1,2,3,4,5,6].map(i=>$('#d_pat_'+i).checked?'low':'high')};if(r!=='')D.cyc.r=Math.min(100,Math.max(0,+r))/100;
    run(()=>api('/rest/v1/app_config?id=eq.1',{method:'PATCH',prefer:'return=minimal',body:{defaults:D,updated_at:new Date().toISOString()}}),'تم حفظ الافتراضيات')}
  if(f.id==='acf'){const ft={};FEATS.forEach(([k])=>{const v=$('#ac_f_'+k).value;if(v)ft[k]=v==='1'});
    run(async()=>{await rpc('admin_set_account',{p_owner:f.dataset.id,p_mode:$('#ac_m').value||null,p_features:ft});ui.acc=null},'تم حفظ الحساب')}
  if(f.id==='ff'){const n=$('#f_n').value.trim(),v=k=>+$('#f_'+k).value||0;
    run(()=>api('/rest/v1/shared_foods',{method:'POST',prefer:'return=minimal',body:{id:'sf_'+Date.now().toString(36),n,grp:$('#f_g').value,k:v('k'),p:v('p'),c:v('c'),f:v('f'),u:$('#f_u').value.trim()||null,ug:v('ug')||null}}),'أُضيف «'+n+'»')}
});
const pending={};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  // الحذف يحتاج ضغطة ثانية خلال 4 ثوانٍ بدل نافذة تأكيد
  const twice=()=>{if(pending[a+id]){delete pending[a+id];return true}pending[a+id]=1;t.textContent='اضغط مرة أخرى للحذف';setTimeout(()=>{delete pending[a+id];render()},4000);return false};
  if(a==='tab'){ui.tab=t.dataset.v;ui.acc=null;render();load(ui.tab)}
  if(a==='acedit'){ui.acc=ui.acc===id?null:id;render();const c=$('#acc_ed');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'})}
  if(a==='acclose'){ui.acc=null;render()}
  if(a==='insd'){ui.insDays=+t.dataset.v;load('insights')}
  if(a==='copy'){const el=$('#'+t.dataset.v);if(el){el.select();try{(navigator.clipboard?navigator.clipboard.writeText(el.value):Promise.reject()).then(()=>msg('تم النسخ'),()=>{document.execCommand('copy');msg('تم النسخ')})}catch(x){}}}
  if(a==='out'){sess=null;ui.admin=null;try{localStorage.removeItem(SK)}catch(x){}render()}
  if(a==='atog')run(()=>api('/rest/v1/announcements?id=eq.'+encodeURIComponent(id),{method:'PATCH',prefer:'return=minimal',body:{active:t.dataset.v==='1'}}),'تم');
  if(a==='adel'&&twice())run(()=>api('/rest/v1/announcements?id=eq.'+encodeURIComponent(id),{method:'DELETE'}),'حُذف الإعلان');
  if(a==='ftog')run(()=>api('/rest/v1/shared_foods?id=eq.'+encodeURIComponent(id),{method:'PATCH',prefer:'return=minimal',body:{active:t.dataset.v==='1',updated_at:new Date().toISOString()}}),'تم');
  if(a==='fdel'&&twice())run(()=>api('/rest/v1/shared_foods?id=eq.'+encodeURIComponent(id),{method:'DELETE'}),'حُذف الصنف');
});
boot();
</script>
</body>
</html>
